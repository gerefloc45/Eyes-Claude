<!DOCTYPE html>
<html>
<body>
  <p id="low" style="color: rgb(200,200,200); background-color: rgb(220,220,220);">
    Testo a basso contrasto
  </p>
  <p id="high" style="color: rgb(0,0,0); background-color: rgb(255,255,255);">
    Testo ad alto contrasto
  </p>
  <div id="parent" style="background-color: rgb(255,255,255);">
    <p id="inherited" style="color: rgb(0,0,0);">
      Testo con background ereditato dal genitore
    </p>
  </div>
  <div id="parentForTranslucent" style="background-color: rgb(0,0,0);">
    <p id="translucent" style="color: rgb(0,0,0); background-color: rgba(255,255,255,0.5);">
      Testo su background semitrasparente
    </p>
  </div>
</body>
</html>
